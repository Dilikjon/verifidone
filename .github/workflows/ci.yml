name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tests
        run: npm test
      - name: Run verification (diagnostic — capture error before exit)
        run: |
          echo "=== DIAGNOSTICS ==="
          pwd
          node -v
          npm -v
          ls -la
          test -f .projectguard.yaml && echo ".projectguard.yaml: OK" || echo ".projectguard.yaml: MISSING"
          echo "--- git ---"
          git status || true
          git branch || true
          git rev-parse HEAD || true
          echo "--- verify ---"
          npm run verify
        shell: bash
