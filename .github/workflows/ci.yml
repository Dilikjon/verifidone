name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tests
        run: npm test
      - name: Run verification
        shell: bash
        run: |
          npm run verify > verify-output.txt 2>&1
          exit_code=$?
          cat verify-output.txt
          echo "VERIFY_EXIT_CODE=$exit_code" >> verify-output.txt
          exit "$exit_code"
      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: verify-output.txt
          if-no-files-found: error